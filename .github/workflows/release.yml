name: Build & Release Custom Module

on:
  push:
    tags:
      - 'v*-custom.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build KernelSU module zip
        run: bash module/build.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/s23-ultra-tweaks-*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/s23-ultra-tweaks-*.zip \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
